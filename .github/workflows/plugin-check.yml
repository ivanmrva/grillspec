name: plugin-source-check

# Guards the PLUGIN SOURCE (this repo) on every push/PR — not any project that uses the plugin.
# Runs the same checks RELEASING.md mandates before a release, so plugin-source drift fails here
# instead of relying on someone remembering to run selfcheck.

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: selfcheck — source integrity + ID-prefix drift + dependency-graph
        run: python3 plugin/tools/selfcheck.py plugin

      - name: dependency graph — valid + docs/DEPENDENCY-GRAPH.md in sync
        run: python3 plugin/tools/gen_depgraph.py --check

      - name: spec-tools regression suite — every lint_spec/check_contracts check still fires
        run: |
          pip install --quiet pyyaml
          python3 plugin/tools/test_lint_spec.py

      - name: task-record regression suite — every accountability check still fires
        run: python3 plugin/tools/test_check_task_record.py

      - name: no-fakes regression suite — the production-tree tripwire still fires
        run: python3 plugin/tools/test_check_no_fakes.py

      - name: config-drift regression suite — code-vs-declared env reconciliation still fires
        run: python3 plugin/tools/test_check_config_drift.py

      - name: deploy-real regression suite — the fake-deploy tripwire still fires
        run: python3 plugin/tools/test_check_deploy_real.py

      - name: migration-real regression suite — the fake/empty-migration tripwire still fires
        run: python3 plugin/tools/test_check_migration_real.py

      - name: mock-budget regression suite — the over-mocking tripwire still fires
        run: python3 plugin/tools/test_check_mock_budget.py

      - name: test-tiers regression suite — declared-tier-vs-actual-suite still fires
        run: python3 plugin/tools/test_check_test_tiers.py

      - name: e2e-target regression suite — the e2e-against-a-local-stack tripwire still fires
        run: python3 plugin/tools/test_check_e2e_target.py

      - name: operate-records regression suite — the 12-operate reconciliation still fires
        run: python3 plugin/tools/test_check_operate_records.py

      - name: release-attestation regression suite — the opt-in release gate still fires
        run: python3 plugin/tools/test_check_release_attestation.py

      - name: e2e gate-chain — the accountability gates compose on a realistic project
        run: python3 plugin/tools/test_e2e_gates.py

      - name: project exec-gate — Claude Code and Codex hook adapters stay equivalent
        run: python3 plugin/tools/test_gate_exec.py

      - name: build — all distribution artifacts compile
        run: python3 build/build.py

      - name: release artifacts — dual manifests, portable skills, and versions agree
        run: python3 build/check_dist.py
